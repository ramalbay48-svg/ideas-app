name: Build IDEAS APP Android Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "management/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install

      - name: Prepare customer app
        run: npm run build:android
        env:
          APP_VARIANT: customer
      - name: Add customer Android platform
        run: npx cap add android
      - name: Sync customer Android app
        run: npx cap sync android
      - name: Build customer APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Save customer APK
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/ideas-app-customer.apk

      - name: Prepare management app
        run: |
          rm -rf android www
          npm run build:android
        env:
          APP_VARIANT: management
      - name: Add management Android platform
        run: npx cap add android
      - name: Sync management Android app
        run: npx cap sync android
      - name: Build management APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Save management APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/ideas-app-management.apk

      - name: Upload both Android apps
        uses: actions/upload-artifact@v4
        with:
          name: ideas-app-two-android-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
